
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff4d6">
<title>العب وتحرّك 🎈</title>
<style>
*{box-sizing:border-box}
:root{--purple:#7955d9;--ink:#342b53}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff6d9,#ffe6f0 55%,#e7f8ff);min-height:100vh;text-align:center;overflow-x:hidden}
button{font:inherit;border:0;border-radius:17px;padding:12px 15px;min-height:46px;font-weight:800;color:var(--ink);cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 #00000013}
button:active{transform:translateY(2px)}
header{padding:12px 10px 5px}
h1{font-size:clamp(25px,6vw,36px);margin:3px}
.subtitle{margin:5px 0 10px;font-size:14px}
#topbar,#games,#controls,#colors{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:7px}
.pill{background:white;padding:8px 13px;border-radius:20px;font-weight:800}
#timer{color:#d44972}
.game-btn{background:white;border:2px solid transparent}
.game-btn.active{border-color:var(--purple);background:#eee7ff}
#instruction{margin:4px auto 10px;width:94%;min-height:48px;border-radius:17px;background:white;padding:11px;font-size:17px;font-weight:800}
#stage{position:relative;width:96%;max-width:720px;margin:auto;border-radius:23px;overflow:hidden;background:linear-gradient(#bcecff,#e4f8ff 64%,#c9f2bf 64%,#a8e5a1);border:3px solid white;box-shadow:0 8px 25px #49345c20}
#scene{display:block;width:100%;height:auto;aspect-ratio:600/340}
#prompt{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#ffffffed;border-radius:15px;padding:8px 12px;font-size:18px;font-weight:900;white-space:nowrap;max-width:94%;z-index:2}
#feedback{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#ffffffed;padding:8px 12px;border-radius:14px;font-weight:900;font-size:15px;max-width:94%;width:max-content;z-index:2}
.primary{background:var(--purple);color:white}.yellow{background:#ffd84d}.green{background:#b9f4d9}.pink{background:#ffc4d7}
#colors{display:none;padding:5px 8px 12px}
.color-btn{width:52px;height:52px;min-height:52px;border:3px solid white;border-radius:50%;padding:0}
#camera{position:fixed;z-index:20;left:7px;bottom:max(7px,env(safe-area-inset-bottom));width:min(43vw,220px);aspect-ratio:4/3;max-height:25vh;background:#211a35;border:3px solid white;border-radius:15px;overflow:hidden;box-shadow:0 4px 20px #0004}
#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#camLabel,#camStatus{position:absolute;right:4px;left:4px;color:white;background:#211a35b8;border-radius:7px;padding:3px;font-size:10px}
#camLabel{top:4px}#camStatus{bottom:4px}
#ending{display:none;margin:12px auto 25px;width:92%;background:white;border-radius:22px;padding:20px;font-size:20px}
footer{padding:10px 8px 24px;font-size:12px;opacity:.8}
.direction-target{cursor:pointer;touch-action:manipulation}
.direction-target circle{stroke:white;stroke-width:5}
.direction-target text{font-family:Arial,sans-serif;font-size:17px;font-weight:bold;fill:#342b53;text-anchor:middle;pointer-events:none}
.direction-target:active{opacity:.75}
@media(max-width:420px){
 h1{font-size:27px}.subtitle{font-size:13px}
 #instruction{font-size:15px}
 #stage{width:98%}
 #prompt{font-size:16px}
 #camera{width:min(39vw,175px);max-height:22vh}
 button{padding:10px 12px}
}
@media(orientation:landscape) and (max-height:500px){
 header{padding:3px}h1{font-size:22px}.subtitle{display:none}
 #games{padding:3px}#instruction{min-height:32px;margin:3px auto;padding:5px}
 #stage{width:72%;margin-right:4px;margin-left:auto}
 #camera{width:23vw;max-height:35vh}
}
</style>
</head>
<body>
<header>
<h1>🎈 العب وتحرّك 🎈</h1>
<p class="subtitle">يلا نلعب ونتحرك ونتعلم مع بعض! 🐻</p>
<div id="topbar">
 <div class="pill">⏱️ الوقت: <span id="timer">30:00</span></div>
 <div class="pill">⭐ النجوم: <span id="stars">0</span></div>
</div>
</header>

<nav id="games">
<button class="game-btn active" data-game="dance">🐯 ارقص مع الحيوانات</button>
<button class="game-btn" data-game="copy">🧒 قلّد الحركة</button>
<button class="game-btn" data-game="color">🎨 ابحث عن اللون</button>
</nav>

<div id="instruction">اضغط «ابدأ اللعب» علشان نبدأ المغامرة!</div>

<main id="stage">
<svg id="scene" viewBox="0 0 600 340" aria-label="مشهد اللعبة">
 <circle cx="510" cy="55" r="27" fill="#ffe16a"/>
 <g fill="#fff" opacity=".9">
  <ellipse cx="100" cy="65" rx="35" ry="14"/><ellipse cx="124" cy="59" rx="25" ry="19"/><ellipse cx="145" cy="67" rx="27" ry="13"/>
  <ellipse cx="340" cy="42" rx="27" ry="12"/><ellipse cx="360" cy="35" rx="21" ry="16"/><ellipse cx="379" cy="43" rx="25" ry="11"/>
 </g>
 <g id="animal"></g>
 <g id="child" style="display:none">
  <ellipse cx="300" cy="284" rx="65" ry="10" fill="#6dbd83" opacity=".5"/>
  <g id="kidLegs">
   <path d="M282 225 L270 269" stroke="#f4b18d" stroke-width="18" stroke-linecap="round"/>
   <path d="M318 225 L330 269" stroke="#f4b18d" stroke-width="18" stroke-linecap="round"/>
   <ellipse cx="267" cy="276" rx="20" ry="9" fill="#6652b7"/><ellipse cx="333" cy="276" rx="20" ry="9" fill="#6652b7"/>
  </g>
  <path d="M273 160 Q300 148 327 160 L335 225 Q300 240 265 225 Z" fill="#ff7799" stroke="#d94d79" stroke-width="3"/>
  <g id="kidArms">
   <path d="M273 171 L247 207" stroke="#f4b18d" stroke-width="16" stroke-linecap="round"/>
   <path d="M327 171 L353 207" stroke="#f4b18d" stroke-width="16" stroke-linecap="round"/>
   <circle cx="247" cy="207" r="10" fill="#f4b18d"/><circle cx="353" cy="207" r="10" fill="#f4b18d"/>
  </g>
  <circle cx="300" cy="122" r="42" fill="#f4b18d" stroke="#d18b68" stroke-width="3"/>
  <path d="M260 119 Q253 77 294 75 Q330 70 341 106 L331 112 Q321 90 296 95 Q276 95 260 119Z" fill="#553624"/>
  <circle cx="286" cy="123" r="4" fill="#342b53"/><circle cx="314" cy="123" r="4" fill="#342b53"/>
  <path d="M288 139 Q300 150 312 139" fill="none" stroke="#9e4d55" stroke-width="3" stroke-linecap="round"/>
  <circle cx="275" cy="135" r="6" fill="#ff9e9e" opacity=".6"/><circle cx="325" cy="135" r="6" fill="#ff9e9e" opacity=".6"/>
 </g>
 <g id="colorTargets" style="display:none"></g>
</svg>
<div id="prompt">جاهز؟</div>
<div id="feedback">اضغط ابدأ اللعب 😊</div>
</main>

<div id="controls">
<button id="startBtn" class="primary">▶️ ابدأ اللعب</button>
<button id="voiceBtn" class="yellow">🗣️ اسمع التعليمات</button>
<button id="camBtn" class="green">📷 تشغيل الكاميرا</button>
<button id="nextBtn" class="pink">التالي ⏭️</button>
</div>

<div id="colors">
<button class="color-btn" data-color="أحمر" style="background:#f04452" aria-label="أحمر"></button>
<button class="color-btn" data-color="أزرق" style="background:#3885ef" aria-label="أزرق"></button>
<button class="color-btn" data-color="أصفر" style="background:#ffd43b" aria-label="أصفر"></button>
<button class="color-btn" data-color="أخضر" style="background:#36bd7b" aria-label="أخضر"></button>
<button class="color-btn" data-color="بنفسجي" style="background:#9659d8" aria-label="بنفسجي"></button>
</div>

<div id="ending">
🎉 برافو يا بطل! 🎉
<p>جمعت <span id="finalStars">0</span> نجمة!</p>
<button class="primary" onclick="restartGame()">العب من جديد 🔄</button>
</div>

<div id="camera">
<video id="video" autoplay muted playsinline></video>
<div id="camLabel">📷 كاميرتك</div>
<div id="camStatus">اضغط تشغيل الكاميرا</div>
</div>
<footer>لعبة حركية للأطفال • استخدم اللعبة مع إشراف شخص بالغ</footer>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const animalRoot=$("animal"),child=$("child"),targets=$("colorTargets"),video=$("video");
const GAME_DURATION=30*60;
let remaining=GAME_DURATION,running=false,game="dance",stars=0,round=0,timerId=null;
let cameraStream=null,lastAward=0,lastMove=0,previousFrame=null,audioContext=null,audioStarted=false;
let currentAnimal="cat",targetColor="أحمر",targetDirection="فوق",kidPose=0,lastFrameTime=0;

const animals=[
 {name:"القطة",kind:"cat",sound:"مياو! يلا نرقص مع القطة!"},
 {name:"الأرنب",kind:"rabbit",sound:"نط نط زي الأرنب!"},
 {name:"الدب",kind:"bear",sound:"هيا نرقص مع الدب!"},
 {name:"الثعلب",kind:"fox",sound:"حرّك إيديك مع الثعلب!"},
 {name:"الفيل",kind:"elephant",sound:"حرّك خرطوم الفيل وارقص!"}
];
const colorList=["أحمر","أزرق","أصفر","أخضر","بنفسجي"];
const colorValues={"أحمر":"#f04452","أزرق":"#3885ef","أصفر":"#ffd43b","أخضر":"#36bd7b","بنفسجي":"#9659d8"};
const directionNames=["فوق","تحت","يمين","شمال"];
const directionPositions={
 "فوق":[300,102],
 "تحت":[300,252],
 "يمين":[455,177],
 "شمال":[145,177]
};

function speak(text){
 if(!("speechSynthesis" in window)){ $("feedback").textContent=text;return; }
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="ar-SA";utterance.rate=.88;utterance.pitch=1.1;
 const voices=window.speechSynthesis.getVoices();
 const voice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ar"));
 if(voice)utterance.voice=voice;
 window.speechSynthesis.speak(utterance);
}
function setInstruction(text,voice){$("instruction").textContent=text;if(voice)speak(text);}
function setFeedback(text){$("feedback").textContent=text;}
function updateTimer(){
 $("timer").textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0");
}
function startClock(){
 if(timerId)clearInterval(timerId);
 timerId=setInterval(()=>{if(!running)return;remaining--;updateTimer();if(remaining<=0)endGame();},1000);
}
function startAudio(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 if(!audioContext)audioContext=new AC();
 if(audioContext.state==="suspended")audioContext.resume();
 audioStarted=true;
}
function playTone(freq,duration){
 if(!audioContext||!audioStarted)return;
 try{
  const osc=audioContext.createOscillator(),gain=audioContext.createGain();
  osc.type="sine";osc.frequency.value=freq;
  gain.gain.setValueAtTime(.09,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
  osc.connect(gain);gain.connect(audioContext.destination);
  osc.start();osc.stop(audioContext.currentTime+duration);
 }catch(e){}
}
function award(message){
 const now=Date.now();if(now-lastAward<1800)return false;
 lastAward=now;stars++;$("stars").textContent=stars;
 setFeedback("⭐ برافو! "+message);speak("برافو! ممتاز! كسبت نجمة!");
 playTone(660,.12);setTimeout(()=>playTone(880,.12),130);return true;
}
function svgEl(tag,attrs,parent){
 const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
 Object.keys(attrs||{}).forEach(k=>el.setAttribute(k,attrs[k]));
 (parent||animalRoot).appendChild(el);return el;
}

/* رسم الحيوان بأجزاء منفصلة تتحرك */
function renderAnimal(kind){
 animalRoot.innerHTML="";
 const group=svgEl("g",{id:"animalBody",transform:"translate(300 190)"});
 const fur={cat:"#f3a64a",rabbit:"#eee9ff",bear:"#9a6545",fox:"#f17d39",elephant:"#9baec9"}[kind];
 const dark={cat:"#d47c30",rabbit:"#d3c7f3",bear:"#70462e",fox:"#bd5128",elephant:"#778da9"}[kind];
 const tail=svgEl("g",{id:"tail"},group);
 if(kind==="cat")svgEl("path",{d:"M50 15 Q100 -5 84 -45 Q78 -58 69 -45 Q79 -18 47 -7",fill:"none",stroke:fur,"stroke-width":17,"stroke-linecap":"round"},tail);
 else if(kind==="fox"){svgEl("path",{d:"M48 15 Q92 5 85 -32 L111 -44 L122 -20 L96 0 L56 26 Z",fill:fur,stroke:dark,"stroke-width":3},tail);svgEl("path",{d:"M111 -44 L122 -20 L96 0 L98 -25 Z",fill:"#fff0d7"},tail);}
 else svgEl("path",{d:"M48 15 Q81 20 80 45",fill:"none",stroke:fur,"stroke-width":13,"stroke-linecap":"round"},tail);
 const legs=svgEl("g",{id:"legs"},group);
 [-27,27].forEach((x,i)=>{const leg=svgEl("g",{id:i?"legR":"legL",transform:`translate(${x} 40)`},legs);svgEl("rect",{x:-10,y:0,width:20,height:43,rx:9,fill:fur,stroke:dark,"stroke-width":2},leg);svgEl("ellipse",{cx:0,cy:43,rx:16,ry:9,fill:kind==="rabbit"?"#fff":dark},leg);});
 svgEl("ellipse",{cx:0,cy:12,rx:49,ry:56,fill:fur,stroke:dark,"stroke-width":3},group);
 svgEl("ellipse",{cx:0,cy:22,rx:28,ry:36,fill:"#fff0d7",opacity:.92},group);
 const arms=svgEl("g",{id:"arms"},group);
 [-1,1].forEach((side,i)=>{const arm=svgEl("g",{id:i?"armR":"armL",transform:`translate(${side*37} -3)`},arms);svgEl("path",{d:`M0 0 Q${side*17} 17 ${side*13} 34`,fill:"none",stroke:fur,"stroke-width":17,"stroke-linecap":"round"},arm);svgEl("circle",{cx:side*13,cy:34,r:10,fill:fur,stroke:dark,"stroke-width":2},arm);});
 const ears=svgEl("g",{id:"ears"},group);
 if(kind==="cat"||kind==="fox")[-1,1].forEach(side=>{const e=svgEl("g",{transform:`translate(${side*27} -53)`},ears);svgEl("path",{d:side<0?"M-12 7 L-17 -24 L5 -8 Z":"M12 7 L17 -24 L-5 -8 Z",fill:fur,stroke:dark,"stroke-width":3},e);svgEl("path",{d:side<0?"M-10 -1 L-13 -16 L-2 -7 Z":"M10 -1 L13 -16 L2 -7 Z",fill:"#ffb2c9"},e);});
 else if(kind==="rabbit")[-1,1].forEach(side=>{const e=svgEl("g",{transform:`translate(${side*17} -67) rotate(${side*12})`},ears);svgEl("ellipse",{cy:-14,rx:11,ry:28,fill:fur,stroke:dark,"stroke-width":2},e);svgEl("ellipse",{cy:-14,rx:5,ry:20,fill:"#f6a9c5"},e);});
 else [-1,1].forEach(side=>svgEl("circle",{cx:side*35,cy:-49,r:17,fill:fur,stroke:dark,"stroke-width":3},ears));
 const head=svgEl("g",{id:"head",transform:"translate(0 -49)"},group);
 svgEl("ellipse",{rx:43,ry:37,fill:fur,stroke:dark,"stroke-width":3},head);
 if(kind==="elephant")svgEl("path",{d:"M20 0 Q45 10 36 35 Q29 47 18 37 Q27 23 17 18",fill:fur,stroke:dark,"stroke-width":3},head);
 else{
  svgEl("ellipse",{cy:12,rx:25,ry:17,fill:kind==="fox"?"#fff0d7":"#fff7e9"},head);
  svgEl("ellipse",{cy:8,rx:6,ry:4,fill:"#4b3543"},head);
  svgEl("path",{d:"M0 13 Q-7 21 -13 16 M0 13 Q7 21 13 16",fill:"none",stroke:"#59404a","stroke-width":2.5,"stroke-linecap":"round"},head);
 }
 [-15,15].forEach(x=>{svgEl("ellipse",{cx:x,cy:-4,rx:4.5,ry:6,fill:"#342b53"},head);svgEl("circle",{cx:x-1,cy:-6,r:1.5,fill:"white"},head);});
 svgEl("circle",{cx:-26,cy:9,r:7,fill:"#ff9eaa",opacity:.6},head);svgEl("circle",{cx:26,cy:9,r:7,fill:"#ff9eaa",opacity:.6},head);
}
function animateAnimal(t){
 if(!running||game!=="dance")return;
 const body=$("animalBody");if(body)body.setAttribute("transform",`translate(300 ${190+Math.sin(t/190)*7}) rotate(${Math.sin(t/320)*4})`);
 const l=$("armL"),r=$("armR");
 if(l)l.setAttribute("transform",`translate(-37 -3) rotate(${-45+Math.sin(t/170)*65})`);
 if(r)r.setAttribute("transform",`translate(37 -3) rotate(${45-Math.sin(t/170)*65})`);
 const ll=$("legL"),rr=$("legR");
 if(ll)ll.setAttribute("transform",`translate(-27 40) rotate(${Math.sin(t/150)*17})`);
 if(rr)rr.setAttribute("transform",`translate(27 40) rotate(${-Math.sin(t/150)*17})`);
 const tail=$("tail");if(tail)tail.setAttribute("transform",`rotate(${Math.sin(t/140)*23})`);
 const head=$("head");if(head)head.setAttribute("transform",`translate(0 -49) rotate(${Math.sin(t/260)*8})`);
}
function animateChild(t){
 if(game!=="copy"||!running)return;
 const arms=$("kidArms"),legs=$("kidLegs");
 if(arms)arms.setAttribute("transform",`rotate(${Math.sin(t/240)*35} 300 180)`);
 if(legs)legs.setAttribute("transform",`rotate(${Math.sin(t/240)*10} 300 230)`);
}

/* لعبة الألوان: أربعة اتجاهات ثابتة، ولون مختلف في كل اتجاه */
function renderColorRound(){
 targets.innerHTML="";
 const shuffled=[...colorList].sort(()=>Math.random()-.5);
 const directions=["فوق","تحت","يمين","شمال"];
 const colors=shuffled.slice(0,4);
 const positions={
  "فوق":[300,105],
  "تحت":[300,245],
  "يمين":[455,175],
  "شمال":[145,175]
 };
 const assigned={};
 directions.forEach((dir,i)=>assigned[dir]=colors[i]);
 targetColor=colors[Math.floor(Math.random()*4)];
 targetDirection=directions.find(dir=>assigned[dir]===targetColor);
 $("prompt").textContent="فين اللون "+targetColor+"؟";
 $("colors").style.display="none";
 directions.forEach(dir=>{
  const [x,y]=positions[dir],color=assigned[dir];
  const g=svgEl("g",{"class":"direction-target",transform:`translate(${x} ${y})`,role:"button","aria-label":dir},targets);
  svgEl("circle",{cx:0,cy:0,r:39,fill:colorValues[color]},g);
  svgEl("circle",{cx:-12,cy:-13,r:9,fill:"white",opacity:.28},g);
  svgEl("text",{x:0,y:57},g).textContent=dir;
  g.addEventListener("click",()=>checkDirection(dir,color));
 });
 setFeedback("اختار مكان اللون المطلوب 👀");
 speak("فين اللون "+targetColor+"؟");
}
function checkDirection(dir,color){
 if(!running||game!=="color")return;
 if(color===targetColor&&dir===targetDirection){
  if(award("لقيت اللون "+targetColor+" في اتجاه "+dir+"!")){
   setFeedback("صح! اللون "+targetColor+" "+dir+"! 🎉");
   setTimeout(()=>{if(running&&game==="color")renderColorRound();},1300);
  }
 }else{
  setFeedback("مش ده المكان، دوّر تاني 😊");
  speak("حاول تاني. دور على اللون "+targetColor);
 }
}
function setGame(name){
 game=name;
 document.querySelectorAll(".game-btn").forEach(b=>b.classList.toggle("active",b.dataset.game===name));
 animalRoot.style.display=name==="dance"?"block":"none";
 child.style.display=name==="copy"?"block":"none";
 targets.style.display=name==="color"?"block":"none";
 $("colors").style.display="none";
 if(name==="dance"){
  const a=animals[round%animals.length];currentAnimal=a.kind;renderAnimal(currentAnimal);
  $("prompt").textContent=a.name;setInstruction("ارقص وحرّك إيديك ورجليك مع "+a.name+"!",running);
  setFeedback("يلا نرقص! 💃");
 }else if(name==="copy"){
  $("prompt").textContent="قلّد الطفل";
  setInstruction("ارفع إيديك لفوق، وبعدين حرّكهم يمين وشمال!",running);
  setFeedback("قلّد حركات الطفل 👏");
 }else{
  setInstruction("اسمع اسم اللون، وحدد مكانه: فوق أو تحت أو يمين أو شمال.",false);
  renderColorRound();
 }
}
function nextRound(){
 if(!running)return;
 round++;
 if(game==="dance"){
  const a=animals[round%animals.length];currentAnimal=a.kind;renderAnimal(currentAnimal);
  $("prompt").textContent=a.name;setInstruction(a.sound,true);
 }else if(game==="copy"){
  kidPose++;
  const poses=["ارفع إيديك لفوق!","صفّق بإيديك!","المس راسك!","حرّك جسمك يمين وشمال!","انط في مكانك!"];
  setInstruction(poses[kidPose%poses.length],true);$("prompt").textContent=poses[kidPose%poses.length];
 }else renderColorRound();
}
function endGame(){
 running=false;if(timerId)clearInterval(timerId);
 $("ending").style.display="block";$("finalStars").textContent=stars;
 setFeedback("خلص وقت اللعب! برافو يا بطل 🎉");
 setInstruction("انتهت مغامرتنا النهارده. أحسنت!",true);
}
function restartGame(){
 remaining=GAME_DURATION;stars=0;round=0;lastAward=0;
 $("stars").textContent="0";$("ending").style.display="none";updateTimer();
 running=true;startAudio();setGame(game);startClock();
 setFeedback("يلا نبدأ! ⭐");speak("أهلا يا بطل! عندنا نص ساعة لعب. يلا نبدأ!");
}
function checkMotion(){
 if(!cameraStream||video.readyState<2||!running||game!=="copy")return;
 const now=Date.now();if(now-lastMove<300)return;lastMove=now;
 try{
  const c=document.createElement("canvas");c.width=32;c.height=24;
  const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(video,0,0,32,24);
  const data=ctx.getImageData(0,0,32,24).data;
  if(previousFrame){
   let diff=0;for(let i=0;i<data.length;i+=16)diff+=Math.abs(data[i]-previousFrame[i])+Math.abs(data[i+1]-previousFrame[i+1])+Math.abs(data[i+2]-previousFrame[i+2]);
   if(diff/(data.length/16)>18&&Date.now()-lastAward>4500)award("تحركت زي البطل!");
  }
  previousFrame=new Uint8ClampedArray(data);
 }catch(e){}
}
function loop(t){
 if(t-lastFrameTime>45){lastFrameTime=t;animateAnimal(t);animateChild(t);checkMotion();}
 requestAnimationFrame(loop);
}
async function startCamera(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  $("camStatus").textContent="افتح اللعبة عبر HTTPS";setFeedback("الكاميرا تحتاج صفحة آمنة HTTPS.");return;
 }
 try{
  cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:640},height:{ideal:480}}});
  video.srcObject=cameraStream;await video.play();
  $("camStatus").textContent="الكاميرا شغالة ✓";$("camLabel").textContent="حرك جسمك وارقص!";
  speak("الكاميرا شغالة! يلا نتحرك!");
 }catch(e){
  $("camStatus").textContent="لم يتم تشغيل الكاميرا";
  setFeedback("اسمح لسفاري باستخدام الكاميرا من إعدادات الموقع.");
 }
}
$("startBtn").addEventListener("click",()=>{
 if(!running){if(remaining<=0)remaining=GAME_DURATION;running=true;startAudio();startClock();setGame(game);speak("يلا بينا! عندنا ثلاثين دقيقة لعب!");}
});
$("voiceBtn").addEventListener("click",()=>{
 startAudio();
 if(game==="dance")speak(animals[round%animals.length].sound);
 else if(game==="copy")speak("قلّد حركات الطفل. ارفع إيديك وصفق وحرّك جسمك!");
 else speak("فين اللون "+targetColor+"؟");
});
$("camBtn").addEventListener("click",startCamera);
$("nextBtn").addEventListener("click",nextRound);
document.querySelectorAll(".game-btn").forEach(btn=>btn.addEventListener("click",()=>setGame(btn.dataset.game)));
updateTimer();renderAnimal("cat");requestAnimationFrame(loop);
window.restartGame=restartGame;
})();
</script>
