<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1458">
<title>العب وتحرّك</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#2a1458;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fff;touch-action:manipulation}
#c{position:fixed;inset:0;display:block}
[hidden]{display:none!important}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.glass{background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 28px rgba(0,0,0,.25)}
#menu{position:fixed;inset:0;overflow:auto;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);background:radial-gradient(circle at 15% 8%,#ff5fa2 0,transparent 42%),radial-gradient(circle at 88% 28%,#35c8ff 0,transparent 42%),radial-gradient(circle at 40% 98%,#ffc93c 0,transparent 38%),#2a1458}
h1{margin:6px 0 2px;font-size:34px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sub{opacity:.9;margin:0 0 12px;font-size:15px}
.ages{display:flex;gap:10px;max-width:520px;margin:0 auto 14px}
.ages button{flex:1;padding:12px;border-radius:20px;font-size:18px;font-weight:700;background:rgba(255,255,255,.18)}
.ages button.on{background:#fff;color:#4a2a9a}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:0 auto}
.card{border-radius:28px;padding:16px 8px;font-size:19px;font-weight:800;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.22),0 12px 24px rgba(0,0,0,.2)}
.card:active{transform:translateY(3px)}
.card i{display:block;font-style:normal;font-size:48px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.card small{display:block;font-size:12px;font-weight:500;opacity:.95}
.card:last-child{grid-column:span 2}
#err{color:#ffd6d6;min-height:22px;margin-top:12px;font-size:15px}
.tip{font-size:13px;opacity:.85;max-width:520px;margin:6px auto}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none}
#hud>*{pointer-events:auto}
.bar{display:flex;align-items:center;justify-content:space-between;border-radius:22px;padding:6px 8px}
.ib{background:rgba(255,255,255,.2);border-radius:16px;padding:8px 14px;font-size:18px}
#ttl{font-size:17px}#st{font-size:22px;font-weight:800}
#pr{margin:8px auto 0;width:fit-content;max-width:100%;border-radius:20px;padding:10px 16px;font-size:clamp(18px,4.6vw,28px);font-weight:800;text-align:center}
#mt{margin:8px auto 0;width:60%;max-width:300px;height:10px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}
#mt i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46e0a0,#ffd23f,#ff5f7a)}
#bn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:13vw;font-weight:900;color:#ffe066;text-shadow:0 5px 0 rgba(0,0,0,.3),0 0 30px rgba(255,200,0,.6);pointer-events:none;opacity:0;transform:scale(.4);transition:all .25s;text-align:center;padding:0 10px}
#bn.on{opacity:1;transform:scale(1)}
#end{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,420px);border-radius:32px;padding:26px 18px;text-align:center;background:rgba(60,30,140,.8)}
#end h2{margin:0 0 6px;font-size:30px}#end p{font-size:20px;margin:6px 0 16px}
#end button{display:block;width:100%;margin:8px 0;padding:14px;border-radius:20px;font-size:20px;font-weight:800;background:#ff5fa2}
#end button+button{background:rgba(255,255,255,.22)}
#v{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>
<section id="menu">
  <h1>🎈 العب وتحرّك</h1>
  <p class="sub">ألعاب تلعبها بحركتك أمام الكاميرا، بدون لمس الشاشة</p>
  <div class="ages"><button id="a3" class="on" onclick="setAge(3)">👶 عمر ٣ سنوات</button><button id="a5" onclick="setAge(5)">🧒 عمر ٥ سنوات</button></div>
  <div class="cards">
    <button class="card" style="background:linear-gradient(145deg,#ff8a5c,#ff4f7b)" onclick="start('dance')"><i>💃</i>ارقص مع الحيوانات<small>كلما تحركت أكثر رقص أكثر</small></button>
    <button class="card" style="background:linear-gradient(145deg,#4fb7ff,#4a63ff)" onclick="start('copy')"><i>🧒</i>قلّد الحركة<small>أعلى، أسفل، يمين، يسار</small></button>
    <button class="card" style="background:linear-gradient(145deg,#47e0a0,#12a58c)" onclick="start('color')"><i>🎨</i>أشر إلى اللون<small>أشر إلى الفقاعة أو أرِ الكاميرا شيئًا بلونها</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ffd23f,#ff9a2e)" onclick="start('balloons')"><i>🎈</i>فرقع البالونات<small>المس البالون في الهواء بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#a58bff,#6a3fd8)" onclick="start('freeze')"><i>🧊</i>ارقص وتجمّد<small>ارقص مع الموسيقى وتجمّد عندما تتوقف</small></button>
  </div>
  <div id="err"></div>
  <p class="tip">ضع الهاتف على حامل ثابت أمام الأطفال بمسافة ٢ إلى ٣ أمتار، مع إضاءة جيدة، وشغّل صوت الهاتف. الصورة لا تُرسل لأي مكان. يُنصح بإشراف شخص بالغ.</p>
</section>
<div id="hud" hidden>
  <div class="bar glass"><button class="ib" onclick="home()">⬅ رجوع</button><b id="ttl"></b><span id="st">⭐ 0</span><button class="ib" onclick="flip()">🔄</button></div>
  <div id="pr" class="glass"></div>
  <div id="mt"><i></i></div>
</div>
<div id="bn"></div>
<div id="end" hidden><h2>🏆 أحسنت يا بطل!</h2><p id="ep"></p><button onclick="start(game)">🔄 العب مرة أخرى</button><button onclick="home()">🏠 القائمة</button></div>
<script>
const $=i=>document.getElementById(i);
const cvs=$('c'),g=cvs.getContext('2d'),v=$('v'),an=document.createElement('canvas'),ag=an.getContext('2d',{willReadFrequently:true});
let W=0,H=0,AW=40,AH=80,age=3,goal=5,game='',run=false,stars=0,facing='user',stream=null,ac=null,music=false,endT=0,last=0,T=0,S={};
let prevL=null,hasPrev=false,mot=null,frame=null,sm=0,lv=0,P=[],lastFail=0;
const COL=[['الأحمر','#ff4d5e',h=>h<14||h>346],['الأصفر','#ffd23f',h=>h>44&&h<68],['الأخضر','#38c172',h=>h>85&&h<160],['الأزرق','#3d8bff',h=>h>195&&h<250],['البرتقالي','#ff9a2e',h=>h>=18&&h<=38]];
const MOV=[['ارفع يديك للأعلى','⬆️','top'],['انزل للأسفل','⬇️','bot'],['تحرّك ناحية اليسار','⬅️','left'],['تحرّك ناحية اليمين','➡️','right'],['اقفز عاليًا','🦘','all']];
const ANI=['🐻','🦁','🐼','🐵','🐶','🦄','🐯','🐸','🐰','🦊'];
const OKW=['أحسنت','أحسنت يا بطل','برافو','ممتاز','أحسنت'];
const TT={dance:'💃 الرقص',copy:'🧒 قلّد الحركة',color:'🎨 أشر إلى اللون',balloons:'🎈 البالونات',freeze:'🧊 تجمّد'};
const P4={top:[.5,.25],bot:[.5,.8],left:[.17,.52],right:[.83,.52]};
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.width=W*d;cvs.height=H*d;g.setTransform(d,0,0,d,0,0);AH=Math.round(AW*H/W);an.width=AW;an.height=AH;prevL=null;mot=null}
addEventListener('resize',resize);resize();
function setAge(a){age=a;goal=a==3?5:8;$('a3').className=a==3?'on':'';$('a5').className=a==5?'on':''}
function say(t,c){try{if(!window.speechSynthesis)return;if(c)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';const vs=speechSynthesis.getVoices().filter(x=>x.lang.replace('_','-').toLowerCase().indexOf('ar')==0);u.voice=vs.find(x=>/laila|mariam|zeina|sara|female/i.test(x.name))||vs[0]||null;u.pitch=1.5;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function beep(f,d,ty){if(!ac)return;const o=ac.createOscillator(),k=ac.createGain();o.type=ty||'triangle';o.frequency.value=f;k.gain.setValueAtTime(.12,ac.currentTime);k.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(k);k.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}
const NOTES=[523,587,659,784,880,784,659,587];let ni=0;
setInterval(()=>{if(music&&run)beep(NOTES[ni++%8],.2,'sine')},270);
function banner(t){const b=$('bn');b.textContent=t;b.className='on';setTimeout(()=>b.className='',1000)}
function prompt_(t,s){$('pr').textContent=t;if(s)say(t)}
function burst(x,y,c,n){for(let i=0;i<(n||20);i++){const a=Math.random()*6.28,s=2+Math.random()*5;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,c:c||pick(['#ffd23f','#ff5fa2','#46e0a0','#4fb7ff']),r:3+Math.random()*5})}}
function ok(){stars++;$('st').textContent='⭐ '+stars+'/'+goal;[660,880,1175].forEach((f,i)=>setTimeout(()=>beep(f),i*100));banner(pick(['أحسنت! 🌟','برافو! 🎉','رائع! 👏']));say(pick(OKW),true);S.t0=Date.now();if(stars>=goal)finish();else nextRound()}
function fail(){const n=Date.now();if(n-lastFail<2500)return;lastFail=n;banner('حاول مرة أخرى 💪');beep(220,.3,'sawtooth');say('حاول مرة أخرى',true)}
function finish(){run=false;music=false;$('end').hidden=false;$('ep').textContent='جمعت '+stars+' نجوم ⭐';say('أحسنت يا بطل! لقد جمعت كل النجوم. إلى اللقاء، وأراك قريبًا')}
async function cam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});v.srcObject=stream;await v.play();prevL=null;hasPrev=false}
async function flip(){facing=facing=='user'?'environment':'user';try{await cam()}catch(e){}}
async function start(k){game=k;clearTimeout(endT);$('end').hidden=true;
 try{if(window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(' '));ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();await cam()}catch(e){$('err').textContent='لم تفتح الكاميرا. اسمح بالكاميرا لموقع Safari، وافتح الصفحة عبر رابط https.';return}
 $('menu').hidden=true;$('hud').hidden=false;$('ttl').textContent=TT[k];stars=0;goal=age==3?5:8;$('st').textContent='⭐ 0/'+goal;S={t0:Date.now(),pr:0,an:0,hold:0,b:[],sp:0,cnt:0,ph:'move',sc:0,bad:0,tgt:-1};run=true;
 const hi={dance:'هيا نرقص',copy:'هيا نقلّد الحركة',color:'هيا نبحث عن الألوان',balloons:'هيا نفرقع البالونات',freeze:'هيا نرقص ونتجمد'}[k];
 say('مرحبًا يا أبطال! '+hi,true);
 if(k=='dance'){prompt_('ارقص مع الحيوان! 💃');music=true}
 else if(k=='freeze'){S.ph='move';S.t0=Date.now();music=true;prompt_('ارقص مع الموسيقى! 🎵')}
 else if(k=='balloons'){S.tgt=age==5?rnd(0,5)|0:-1;balPrompt()}
 else nextRound()}
function home(){run=false;music=false;clearTimeout(endT);try{speechSynthesis.cancel()}catch(e){}$('hud').hidden=true;$('end').hidden=true;$('menu').hidden=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;frame=null}
function balPrompt(){if(S.tgt<0)prompt_('فرقع البالونات بيدك! 🎈',true);else prompt_('فرقع البالونات '+COL[S.tgt][0],true)}
function nextRound(){S.hold=0;S.t0=Date.now();
 if(game=='copy'){S.m=pick(age==3?[MOV[0],MOV[2],MOV[3],MOV[4]]:MOV);prompt_(S.m[0],true)}
 else if(game=='color'){const c=[...COL].sort(()=>Math.random()-.5).slice(0,4),d=['top','bot','left','right'];S.cols={};d.forEach((k,i)=>S.cols[k]=c[i]);S.tgt=pick(d);S.dw={top:0,bot:0,left:0,right:0};S.oh=0;prompt_('أين اللون '+S.cols[S.tgt][0]+'؟ أشر إليه',true)}
 else if(game=='balloons'&&age==5&&S.cnt%3==0){S.tgt=rnd(0,5)|0;balPrompt()}}
function analyze(){if(v.readyState<2||!v.videoWidth)return;
 const vw=v.videoWidth,vh=v.videoHeight,s=Math.max(AW/vw,AH/vh),dw=vw*s,dh=vh*s;
 ag.save();ag.translate(AW,0);ag.scale(-1,1);ag.drawImage(v,(AW-dw)/2,(AH-dh)/2,dw,dh);ag.restore();
 frame=ag.getImageData(0,0,AW,AH).data;const n=AW*AH;
 if(!prevL||prevL.length!=n){prevL=new Int16Array(n);hasPrev=false}if(!mot||mot.length!=n)mot=new Uint8Array(n);
 let c=0;for(let i=0;i<n;i++){const o=i*4,L=frame[o]+frame[o+1]+frame[o+2];const m=hasPrev&&Math.abs(L-prevL[i])>90?1:0;mot[i]=m;c+=m;prevL[i]=L}
 hasPrev=true;sm=sm*.6+(c/n)*.4;lv=Math.min(1,sm/.2)}
function fr(x0,y0,x1,y1){if(!mot)return 0;const a=Math.max(0,x0*AW|0),b=Math.max(0,y0*AH|0),c=Math.min(AW,Math.ceil(x1*AW)),d=Math.min(AH,Math.ceil(y1*AH));let k=0,t=0;for(let y=b;y<d;y++)for(let x=a;x<c;x++){k+=mot[y*AW+x];t++}return t?k/t:0}
function hm(r,gg,b,fn){const m=Math.max(r,gg,b),n=Math.min(r,gg,b),d=m-n;if(m<90||d/m<.5)return false;const h=m==r?((gg-b)/d+6)%6:m==gg?(b-r)/d+2:(r-gg)/d+4;return fn(h*60)}
function cf(x0,y0,x1,y1,fn){if(!frame)return 0;const a=x0*AW|0,b=y0*AH|0,c=Math.ceil(x1*AW),d=Math.ceil(y1*AH);let k=0,t=0;for(let y=b;y<d;y++)for(let x=a;x<c;x++){const o=(y*AW+x)*4;if(hm(frame[o],frame[o+1],frame[o+2],fn))k++;t++}return t?k/t:0}
function tick(){if(!run)return;$('mt').firstChild.style.width=lv*100+'%';const k=game,now=Date.now();
 if(k=='dance'){if(sm>(age==3?.03:.06))S.pr+=lv;const need=age==3?18:28;if(S.pr>=need){S.pr=0;S.an++;burst(W/2,H/2);ok()}else if(now-S.t0>14000){S.t0=now;say('تحرّك أكثر! هيا نرقص')}}
 else if(k=='copy'){if(!S.m)return;const m=S.m[2],f=m=='top'?fr(0,0,1,.38):m=='bot'?fr(0,.62,1,1):m=='left'?fr(0,0,.4,1):m=='right'?fr(.6,0,1,1):sm,th=age==3?.07:.1;
  if(f>th)S.hold++;else S.hold=Math.max(0,S.hold-1);const need=age==3?7:6;S.pg=S.hold/need;
  if(S.hold>=need){burst(W*.5,H*.5);ok()}else if(now-S.t0>(age==3?12000:9000)){fail();nextRound()}}
 else if(k=='color'){if(!S.cols)return;let hit=null;
  for(const d in P4){const [x,y]=P4[d],f=fr(x-.17,y-.1,x+.17,y+.1);if(f>.16)S.dw[d]++;else S.dw[d]=Math.max(0,S.dw[d]-1);if(S.dw[d]>=(age==3?6:8)&&!hit)hit=d}
  const tc=S.cols[S.tgt];if(cf(.2,.3,.8,.7,tc[2])>.1)S.oh++;else S.oh=0;if(S.oh>=8)hit=S.tgt;
  if(hit){if(hit==S.tgt){const p=P4[hit];burst(p[0]*W,p[1]*H,S.cols[hit][1],30);ok()}else{S.dw[hit]=0;fail()}}
  else if(now-S.t0>25000){fail();nextRound()}}
 else if(k=='balloons'){for(const b of S.b){if(b.dead)continue;const rw=b.r/W*1.2,rh=b.r/H*1.3;if(fr(b.x-rw,b.y-rh,b.x+rw,b.y+rh)>.2){b.dead=1;burst(b.x*W,b.y*H,COL[b.c][1],22);beep(900,.1,'square');
   if(S.tgt<0||b.c==S.tgt){S.cnt++;ok()}else fail()}}}
 else if(k=='freeze'){const el=(now-S.t0)/1000;
  if(S.ph=='move'){S.sc+=lv;if(el>(age==3?6:8)){if(S.sc<7){S.t0=now;S.sc=0;say('تحرّك أكثر!')}else{S.ph='freeze';S.t0=now;S.bad=0;music=false;prompt_('🧊 تجمّد! لا تتحرك',true);banner('🧊 تجمّد!')}}}
  else{if(el>1.4&&sm>.045)S.bad++;if(el>(age==3?4:5)){S.ph='move';S.t0=now;S.sc=0;music=true;if(S.bad<=2){ok()}else fail();prompt_('ارقص مع الموسيقى! 🎵')}}}}
/* ---------- الرسم ---------- */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function ln(a,b,c,d,w,col){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function emo(t,x,y,s,r){g.save();g.translate(x,y);g.rotate(r||0);g.font=s+'px system-ui,"Apple Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,0,0);g.restore()}
function drawCam(){if(frame&&v.videoWidth){const vw=v.videoWidth,vh=v.videoHeight,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;g.save();g.translate(W,0);g.scale(-1,1);g.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);g.restore()}else{g.fillStyle='#2a1458';g.fillRect(0,0,W,H)}
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(60,20,130,.45)');gr.addColorStop(.5,'rgba(40,20,110,.12)');gr.addColorStop(1,'rgba(40,20,110,.4)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
function arm(sx,sy,a){g.save();g.translate(sx,sy);g.rotate(a*Math.PI/180);ln(0,0,0,64,16,'#ffcc99');g.restore()}
function boy(x,y,s,p){g.save();g.translate(x,y);g.scale(s,s);g.translate(-100,-135);g.translate(p.tx,p.ty);g.translate(100,245);g.rotate(p.rot*Math.PI/180);g.scale(1,p.sy);g.translate(-100,-245);
 ln(86,165,82,232,19,'#3b5bdb');ln(114,165,118,232,19,'#3b5bdb');g.fillStyle='#333';[78,122].forEach(cx=>{g.beginPath();g.ellipse(cx,241,19,9,0,0,6.3);g.fill()});
 arm(68,108,p.aL);arm(132,108,p.aR);
 const gr=g.createLinearGradient(0,92,0,176);gr.addColorStop(0,'#ff8a5c');gr.addColorStop(1,'#ff4f7b');g.fillStyle=gr;rr(60,92,80,84,26);g.fill();
 g.fillStyle='#ffd9b3';g.beginPath();g.arc(100,62,38,0,6.3);g.fill();
 g.fillStyle='#4a2c17';g.beginPath();g.moveTo(62,56);g.quadraticCurveTo(100,4,138,56);g.quadraticCurveTo(120,34,100,38);g.quadraticCurveTo(80,34,62,56);g.fill();
 g.fillStyle='#222';[87,113].forEach(cx=>{g.beginPath();g.arc(cx,66,4.5,0,6.3);g.fill()});
 g.fillStyle='rgba(255,120,140,.5)';[76,124].forEach(cx=>{g.beginPath();g.arc(cx,78,6,0,6.3);g.fill()});
 g.strokeStyle='#222';g.lineWidth=3.5;g.lineCap='round';g.beginPath();g.moveTo(88,81);g.quadraticCurveTo(100,93,112,81);g.stroke();g.restore()}
function pose(k,t){const p=(Math.sin(t/260)+1)/2,o={tx:0,ty:0,sy:1,rot:0,aL:10,aR:-10};
 if(k=='top'){o.aL=150+25*p;o.aR=-o.aL}else if(k=='bot'){o.sy=1-.3*p;o.aL=40;o.aR=-40}
 else if(k=='left'){o.tx=-50*p;o.rot=-8*p;o.aL=o.aR=90}else if(k=='right'){o.tx=50*p;o.rot=8*p;o.aL=o.aR=-90}
 else{o.ty=-55*Math.abs(Math.sin(t/260));o.aL=140;o.aR=-140}return o}
function bubble(x,y,r,col,pr,t){const pl=1+Math.sin(t/300)*.04;g.save();g.shadowColor=col;g.shadowBlur=30;const gr=g.createRadialGradient(x-r*.3,y-r*.35,r*.08,x,y,r*pl);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.3,col);gr.addColorStop(1,col);g.fillStyle=gr;g.beginPath();g.arc(x,y,r*pl,0,6.3);g.fill();g.restore();
 g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=6;g.beginPath();g.arc(x,y,r*pl+10,0,6.3);g.globalAlpha=.25;g.stroke();g.globalAlpha=1;
 if(pr>0){g.beginPath();g.arc(x,y,r*pl+10,-1.57,-1.57+6.283*Math.min(1,pr));g.strokeStyle='#fff';g.lineWidth=8;g.stroke()}}
function balloon(b){const R=b.r,x=b.x*W,y=b.y*H,c=COL[b.c][1];g.save();g.translate(x+Math.sin(b.ph)*10,y);
 ln(0,R*1.2,Math.sin(b.ph*2)*8,R*2.6,2,'rgba(255,255,255,.8)');
 const gr=g.createRadialGradient(-R*.3,-R*.4,R*.1,0,0,R*1.2);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.25,c);gr.addColorStop(1,c);g.fillStyle=gr;g.shadowColor='rgba(0,0,0,.3)';g.shadowBlur=14;
 g.beginPath();g.ellipse(0,0,R,R*1.2,0,0,6.3);g.fill();g.shadowBlur=0;g.fillStyle=c;g.beginPath();g.moveTo(-6,R*1.18);g.lineTo(6,R*1.18);g.lineTo(0,R*1.38);g.fill();g.restore()}
function glow(d){const gr=d=='top'?g.createLinearGradient(0,0,0,H*.3):d=='bot'?g.createLinearGradient(0,H,0,H*.7):d=='left'?g.createLinearGradient(0,0,W*.35,0):g.createLinearGradient(W,0,W*.65,0);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
function draw(t){drawCam();const k=game;
 if(k=='dance'){const cx=W/2,cy=H*.5,s=Math.min(W,H)*.5,b=Math.sin(t/180)*lv*30;
  const gr=g.createRadialGradient(cx,cy,10,cx,cy,s*.8);gr.addColorStop(0,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=25;g.shadowOffsetY=12;emo(ANI[S.an%ANI.length],cx,cy+b,s*(.9+lv*.25),Math.sin(t/160)*(.05+lv*.35));g.restore();
  g.strokeStyle='#ffd23f';g.lineWidth=10;g.lineCap='round';g.beginPath();g.arc(cx,cy,s*.62,-1.57,-1.57+6.283*Math.min(1,S.pr/(age==3?18:28)));g.stroke()}
 else if(k=='copy'&&S.m){const m=S.m[2];glow(m=='bot'?'bot':m=='all'?'':m);
  const ph=Math.min(W*.44,H*.3),px=W-ph-12,py=H*.2;g.fillStyle='rgba(255,255,255,.22)';rr(px,py,ph,ph,28);g.fill();g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=3;g.stroke();
  boy(px+ph/2,py+ph/2,ph/300,pose(m,t));emo(S.m[1],px+ph*.2,py+ph*.2,ph*.3);
  g.strokeStyle='#46e0a0';g.lineWidth=8;g.lineCap='round';g.beginPath();g.arc(40,H-50,26,-1.57,-1.57+6.283*(S.pg||0));g.stroke()}
 else if(k=='color'&&S.cols){const R=Math.min(W,H)*.11;for(const d in P4){const [x,y]=P4[d];bubble(x*W,y*H,R,S.cols[d][1],S.dw[d]/(age==3?6:8),t)}
  if(S.oh>0){g.strokeStyle='#fff';g.lineWidth=8;g.beginPath();g.arc(W/2,H*.5,R*.9,-1.57,-1.57+6.283*S.oh/8);g.stroke()}
  g.fillStyle=S.cols[S.tgt][1];g.beginPath();g.arc(W/2,H*.5,R*.5+Math.sin(t/250)*4,0,6.3);g.fill();g.strokeStyle='#fff';g.lineWidth=5;g.stroke()}
 else if(k=='balloons'){const dt=16/1000;S.sp-=dt;if(S.sp<=0){S.sp=age==3?1.1:.8;S.b.push({x:rnd(.12,.88),y:1.12,vy:rnd(.1,.17)*(age==3?.8:1.1),c:S.tgt>=0&&Math.random()<.45?S.tgt:rnd(0,5)|0,r:Math.min(W,H)*.09,ph:rnd(0,6)})}
  for(const b of S.b){b.y-=b.vy*dt;b.ph+=.03;balloon(b)}S.b=S.b.filter(b=>!b.dead&&b.y>-.2)}
 else if(k=='freeze'){const fz=S.ph=='freeze';if(fz){g.fillStyle='rgba(90,190,255,.35)';g.fillRect(0,0,W,H)}
  const cx=W/2,cy=H*.5,s=Math.min(W,H)*.4;g.save();g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=22;emo(fz?'🧊':'🎵',cx,cy+(fz?0:Math.sin(t/150)*20),s*(fz?1:1+lv*.3),fz?0:Math.sin(t/200)*.3);g.restore()}
 drawP()}
function drawP(){for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.l-=.02;g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}g.globalAlpha=1;P=P.filter(p=>p.l>0)}
function loop(t){requestAnimationFrame(loop);T=t;if(!$('hud').hidden){if(run&&t-last>95){last=t;analyze();tick()}else if(!run&&!$('end').hidden){}draw(t)}}
requestAnimationFrame(loop);
